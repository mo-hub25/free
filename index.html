<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download BlackHoleCreator</title>

<!-- Google Font (optional — remove if your app already loads one) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   ADVANCED DOWNLOAD BUTTON — scoped under .bhc-* so it won't clash with
   your app's existing styles.
   ========================================================================== */

.bhc-wrap {
  --bg-deep:      #0f172a;
  --bg-mid:       #1e293b;
  --btn-bg:       #0b0f17;
  --btn-border:   #2d3a52;
  --btn-glow:     #3b82f6;
  --btn-accent:   #60a5fa;
  --btn-text:     #e2e8f0;
  --btn-success:  #22c55e;
  --btn-error:    #ef4444;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

/* ── The button itself ─────────────────────────────────────────────────── */
.bhc-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.85rem;
  padding: 1.15rem 2.4rem 1.15rem 2.6rem;
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1;
  color: var(--btn-text);
  background: var(--btn-bg);
  border: 1.5px solid var(--btn-border);
  border-radius: 100px;
  cursor: pointer;
  overflow: hidden;
  isolation: isolate;
  z-index: 1;
  outline: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1),
              border-color 0.35s ease,
              box-shadow 0.35s ease;
  box-shadow:
    0 15px 30px -12px rgba(0, 0, 0, 0.8),
    0 0 0 0 rgba(59, 130, 246, 0.3);
  min-width: 260px;
}

/* Glowing animated border on hover */
.bhc-btn::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 100px;
  padding: 2px;
  background: linear-gradient(135deg,
    transparent 0%, transparent 30%,
    var(--btn-glow) 50%,
    transparent 70%, transparent 100%);
  background-size: 250% 100%;
  background-position: 100% 0;
  opacity: 0.85;
  z-index: -2;
  pointer-events: none;
  transition: background-position 0.6s ease, opacity 0.3s ease;
}
.bhc-btn:hover::before { background-position: 0% 0; opacity: 1; }

/* Inner glass highlight */
.bhc-btn::after {
  content: '';
  position: absolute;
  inset: 1px;
  border-radius: 100px;
  background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 60%);
  pointer-events: none;
  z-index: -1;
}

.bhc-btn:hover {
  transform: translateY(-2px);
  border-color: var(--btn-accent);
  box-shadow:
    0 22px 35px -15px rgba(0, 0, 0, 0.9),
    0 0 0 2px rgba(59, 130, 246, 0.25),
    0 0 22px -5px var(--btn-glow);
}
.bhc-btn:active { transform: translateY(0) scale(0.98); transition-duration: 0.1s; }

/* Progress fill that grows behind the label */
.bhc-progress {
  position: absolute;
  inset: 0;
  border-radius: 100px;
  overflow: hidden;
  z-index: -1;
  pointer-events: none;
}
.bhc-progress-fill {
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  width: 0%;
  background: radial-gradient(circle at 70% 50%,
    rgba(59, 130, 246, 0.45) 0%,
    rgba(59, 130, 246, 0.12) 60%,
    transparent 100%);
  border-radius: 100px;
  transition: width 0.35s cubic-bezier(0.3, 0.9, 0.4, 1);
}

/* Shimmer sweep */
.bhc-shimmer {
  position: absolute;
  inset: 0;
  border-radius: 100px;
  background: linear-gradient(105deg,
    transparent 30%,
    rgba(255,255,255,0.15) 45%,
    rgba(255,255,255,0.28) 50%,
    rgba(255,255,255,0.15) 55%,
    transparent 70%);
  background-size: 250% 100%;
  background-position: 130% 0;
  opacity: 0;
  pointer-events: none;
  z-index: 2;
  transition: opacity 0.2s;
}
.bhc-btn:hover .bhc-shimmer {
  opacity: 1;
  animation: bhcShimmer 1.8s infinite ease-in-out;
}
@keyframes bhcShimmer {
  0%   { background-position: 130% 0; }
  60%  { background-position: -30% 0; }
  100% { background-position: -30% 0; }
}

/* Icon + label */
.bhc-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 1.7rem;
  height: 1.7rem;
  transition: transform 0.3s ease;
}
.bhc-btn:hover .bhc-icon { transform: translateY(-2px); }
.bhc-icon svg {
  width: 100%; height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.1;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 8px rgba(96, 165, 250, 0.6));
}
.bhc-btn:hover .bhc-icon svg { animation: bhcBounce 0.7s infinite ease-in-out; }
@keyframes bhcBounce {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(3px); }
}

.bhc-label {
  position: relative;
  z-index: 3;
  text-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
  white-space: nowrap;
}

/* ── States ────────────────────────────────────────────────────────────── */
.bhc-btn.is-busy { cursor: progress; pointer-events: none; }
.bhc-btn.is-busy .bhc-icon svg { animation: bhcSpin 0.9s linear infinite; }
@keyframes bhcSpin { to { transform: rotate(360deg); } }

.bhc-btn.is-success {
  --btn-border: var(--btn-success);
  border-color: var(--btn-success);
  box-shadow:
    0 0 0 2px rgba(34, 197, 94, 0.25),
    0 0 25px -5px var(--btn-success);
}
.bhc-btn.is-success .bhc-progress-fill {
  background: radial-gradient(circle at 70% 50%,
    rgba(34, 197, 94, 0.5) 0%, transparent 80%);
}
.bhc-btn.is-success .bhc-icon svg {
  animation: none;
  filter: drop-shadow(0 0 10px #4ade80);
}

.bhc-btn.is-error {
  --btn-border: var(--btn-error);
  border-color: var(--btn-error);
  box-shadow: 0 0 22px -6px var(--btn-error);
}
.bhc-btn.is-error .bhc-progress-fill {
  background: radial-gradient(circle at 70% 50%,
    rgba(239, 68, 68, 0.45) 0%, transparent 80%);
}

/* ── Fallback link that appears if Drive blocks the download ──────────── */
.bhc-fallback {
  font-size: 0.82rem;
  color: #94a3b8;
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  transition: opacity 0.35s ease, max-height 0.35s ease;
  text-align: center;
  line-height: 1.5;
}
.bhc-fallback.is-visible { opacity: 1; max-height: 120px; }
.bhc-fallback a {
  color: var(--btn-accent, #60a5fa);
  text-decoration: underline;
  text-underline-offset: 2px;
}
.bhc-fallback a:hover { color: #93c5fd; }

/* ── Meta line under the button ───────────────────────────────────────── */
.bhc-meta {
  font-size: 0.75rem;
  color: #64748b;
  letter-spacing: 0.3px;
  text-align: center;
}

/* ── Mobile ───────────────────────────────────────────────────────────── */
@media (max-width: 420px) {
  .bhc-btn {
    width: 100%;
    min-width: 0;
    padding: 1.05rem 1.6rem;
    font-size: 1rem;
    gap: 0.65rem;
  }
  .bhc-icon { width: 1.45rem; height: 1.45rem; }
}
</style>
</head>

<body style="margin:0; background:linear-gradient(145deg,#0f172a 0%,#1e293b 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem;">

  <!-- ═══════════════ ADVANCED DOWNLOAD BUTTON ═══════════════ -->
  <div class="bhc-wrap">

    <button class="bhc-btn" id="bhcBtn" aria-label="Download BlackHoleCreator APK">
      <span class="bhc-progress"><span class="bhc-progress-fill" id="bhcFill"></span></span>
      <span class="bhc-shimmer"></span>
      <span class="bhc-icon" id="bhcIcon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3v12m0 0l-4-4m4 4l4-4"/>
          <path d="M5 21h14" stroke-width="2.2"/>
        </svg>
      </span>
      <span class="bhc-label" id="bhcLabel">Download APK</span>
    </button>

    <div class="bhc-fallback" id="bhcFallback">
      Download didn't start? <a id="bhcFallbackLink" href="#" target="_blank" rel="noopener">Open the file in Google Drive ↗</a>
    </div>

    <div class="bhc-meta" id="bhcMeta">Android • v0.32.0</div>
  </div>
  <!-- ═════════════════════════════════════════════════════════ -->

<script>
(function () {
  'use strict';

  /* ──────────────────────────────────────────────────────────
     CONFIG — change these if you update the file
     ────────────────────────────────────────────────────────── */
  const CONFIG = {
    FILE_ID:   '1mKfkR3zQb_JbDXM-4lr6bvKxeXJzWpc3',
    APK_NAME:  'BlackHoleCreator-0.32.0-android.apk',
    // Where the Drive "preview" page lives — used as a fallback
    FALLBACK_URL: 'https://drive.google.com/file/d/1mKfkR3zQb_JbDXM-4lr6bvKxeXJzWpc3/view',
    // Direct-download URL (works for files under ~100 MB without a token,
    // and for many larger ones with confirm=t)
    DIRECT_URL: 'https://drive.google.com/uc?export=download&id=1mKfkR3zQb_JbDXM-4lr6bvKxeXJzWpc3&confirm=t'
  };

  /* ──────────────────────────────────────────────────────────
     DOM
     ────────────────────────────────────────────────────────── */
  const btn          = document.getElementById('bhcBtn');
  const fill         = document.getElementById('bhcFill');
  const label        = document.getElementById('bhcLabel');
  const icon         = document.getElementById('bhcIcon');
  const fallback     = document.getElementById('bhcFallback');
  const fallbackLink = document.getElementById('bhcFallbackLink');
  const meta         = document.getElementById('bhcMeta');

  fallbackLink.href = CONFIG.FALLBACK_URL;

  /* ──────────────────────────────────────────────────────────
     ICONS (inline SVG swaps for the different states)
     ────────────────────────────────────────────────────────── */
  const ICONS = {
    download: '<path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M5 21h14" stroke-width="2.2"/>',
    spinner:  '<circle cx="12" cy="12" r="9" stroke-opacity="0.25"/><path d="M21 12a9 9 0 0 0-9-9" stroke-width="2.4"/>',
    check:    '<path d="M20 6L9 17l-5-5" stroke-width="2.4"/>',
    cross:    '<path d="M18 6L6 18M6 6l12 12" stroke-width="2.4"/>'
  };
  function setIcon(name) {
    icon.querySelector('svg').innerHTML = ICONS[name] || ICONS.download;
  }

  /* ──────────────────────────────────────────────────────────
     STATE HELPERS
     ────────────────────────────────────────────────────────── */
  let busy = false;

  function setBusy(on) {
    busy = on;
    btn.classList.toggle('is-busy', on);
    btn.setAttribute('aria-busy', on ? 'true' : 'false');
  }
  function clearStates() {
    btn.classList.remove('is-success', 'is-error');
    fill.style.width = '0%';
    setIcon('download');
    label.textContent = 'Download APK';
    fallback.classList.remove('is-visible');
    meta.textContent = 'Android • v0.32.0';
  }

  /* ──────────────────────────────────────────────────────────
     TRIGGER THE DOWNLOAD
     Google Drive blocks fetch() cross-origin, so we can't read
     progress. We instead trigger a native browser download via
     a hidden <a download> and animate a *simulated* progress bar.
     ────────────────────────────────────────────────────────── */
  function triggerDriveDownload() {
    const a = document.createElement('a');
    a.href = CONFIG.DIRECT_URL;
    a.download = CONFIG.APK_NAME;
    // Some browsers ignore the download attribute cross-origin and
    // navigate instead — opening in a new tab avoids losing the page.
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  /* ──────────────────────────────────────────────────────────
     SIMULATED PROGRESS
     Drive won't give us Content-Length, so we animate up to ~92%
     over ~2.5s, then jump to 100% on success.
     ────────────────────────────────────────────────────────── */
  let progressTimer = null;
  function startFakeProgress() {
    let pct = 0;
    fill.style.width = '0%';
    clearInterval(progressTimer);

    progressTimer = setInterval(() => {
      // ease-out: slow down as it approaches 92
      const remaining = 92 - pct;
      pct += Math.max(0.6, remaining * 0.08);
      if (pct >= 92) { pct = 92; clearInterval(progressTimer); }

      fill.style.width = pct + '%';
      label.textContent = 'Downloading… ' + Math.floor(pct) + '%';
    }, 70);
  }

  /* ──────────────────────────────────────────────────────────
     MAIN CLICK HANDLER
     ────────────────────────────────────────────────────────── */
  btn.addEventListener('click', function () {
    if (busy) return;

    clearStates();
    setBusy(true);
    setIcon('spinner');
    label.textContent = 'Connecting…';
    fallback.classList.remove('is-visible');

    // Small delay so the spinner is visible before the browser
    // download dialog takes over.
    setTimeout(() => {
      startFakeProgress();

      try {
        triggerDriveDownload();

        // Consider it a success unless the browser throws.
        // Show a fallback link in case Drive silently blocked it
        // (quota exceeded, virus-scan page, etc.).
        setTimeout(() => {
          clearInterval(progressTimer);
          fill.style.width = '100%';
          setBusy(false);
          btn.classList.add('is-success');
          setIcon('check');
          label.textContent = '✓ Downloaded';
          meta.textContent = 'Check your browser downloads';

          // Reveal fallback in case Drive showed its warning page instead
          setTimeout(() => fallback.classList.add('is-visible'), 900);

          // Auto-reset after a while so the button is reusable
          setTimeout(() => {
            if (!busy) clearStates();
          }, 6000);
        }, 2400);

      } catch (err) {
        // Rare — most failures happen silently inside the browser.
        clearInterval(progressTimer);
        setBusy(false);
        btn.classList.add('is-error');
        setIcon('cross');
        label.textContent = '✗ Download failed';
        meta.textContent = 'Try the fallback link below';
        fallback.classList.add('is-visible');
        console.error('[Download button]', err);
      }
    }, 350);
  });

  /* Keyboard: Space / Enter already work on <button>, but we
     explicitly prevent the default page-scroll on Space. */
  btn.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Spacebar') e.preventDefault();
  });

})();
</script>
</body>
</html>
